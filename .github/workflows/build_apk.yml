name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ensure Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.2
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SimpleCalculator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ./SimpleCalculator.apk
        gh release delete v1.0.0 --yes || true
        git tag -d v1.0.0 2>/dev/null || true
        gh release create v1.0.0 ./SimpleCalculator.apk \
          --title "Release v1.0.0 - Calculator Android App" \
          --notes "### 📱 فایل نصبی برنامه ماشین‌حساب اندروید%0Aبرای نصب روی گوشی، فایل SimpleCalculator.apk زیر را مستقیماً دانلود و نصب کنید."
